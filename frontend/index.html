<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="JobLeaf" />
  
  <!-- SEO Meta Description & Tags -->
  <title>JobLeaf - Find Your Dream Job Today</title>
  <meta name="description" content="Discover top tech, design, marketing, and remote career opportunities on JobLeaf. Connect with top employers and apply to your dream job today." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="http://localhost:5173/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="http://localhost:5173/" />
  <meta property="og:title" content="JobLeaf - Find Your Dream Job Today" />
  <meta property="og:description" content="Discover top career opportunities on JobLeaf. Connect with top employers and apply seamlessly." />
  <meta property="og:image" content="/favicon.svg" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="http://localhost:5173/" />
  <meta name="twitter:title" content="JobLeaf - Find Your Dream Job Today" />
  <meta name="twitter:description" content="Discover top career opportunities on JobLeaf. Connect with top employers and apply seamlessly." />
  <meta name="twitter:image" content="/favicon.svg" />

  <!-- Structured Data (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "JobLeaf",
    "url": "http://localhost:5173/",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "http://localhost:5173/jobs?search={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&family=Nunito:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
