openapi: 3.0.3
info:
  title: JobLeaf API
  version: 1.0.0
  description: API specification for managing companies, users, jobs.
  contact:
    name: JobLeaf Team

servers:
  - url: http://localhost:8080/jobleaf
    description: Local development server.

security:
  - bearerAuth: [ ]

tags:
  - name: Company
    description: Companies management endpoints.
  - name: Contact
    description: Contacts management endpoints.
  - name: Authentication
    description: Authentication endpoints.

paths:
  /companies/public:
    get:
      tags: [ Company ]
      operationId: listCompanies
      summary: List companies.
      description: Returns all companies together with their jobs. Public endpoint, no authentication required.
      security: [ ]
      parameters: [ ]
      responses:
        "200":
          description: Companies retrieved successfully.
          content:
            application/vnd.jobleaf+json;v=1.0:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompanyResponse'
        "406": { $ref: '#/components/responses/NotAcceptable' }
        "429": { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/UnexpectedError' }

  /contacts/public:
    post:
      tags: [Contact]
      operationId: createContact
      summary: Create contact.
      description: Creates contact from the contact us page. Public endpoint, no authentication required.
      security: [ ]
      parameters: [ ]
      requestBody:
        required: true
        content:
          application/vnd.jobleaf+json;v=1.0:
            schema:
              $ref: '#/components/schemas/CreateContactRequest'
      responses:
        '201':
          description: Contact created successfully.
          content:
            application/vnd.jobleaf+json;v=1.0:
              schema:
                $ref: '#/components/schemas/CreateContactResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /auth/login/public:
    post:
      tags: [Authentication]
      operationId: loginUser
      summary: Login user.
      description: |
        Checks the email and password and returns a signed JWT. Send it on later requests as
        `Authorization: Bearer <jwtToken>` until `expiresAt`.
      security: [ ]
      parameters: [ ]
      requestBody:
        required: true
        content:
          application/vnd.jobleaf+json;v=1.0:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful.
          content:
            application/vnd.jobleaf+json;v=1.0:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401':
          description: Invalid email or password. The same message is used for both, so callers cannot tell which emails are registered.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CompanyId:
      name: companyId
      in: path
      required: true
      description: Unique company identifier.
      schema:
        $ref: '#/components/schemas/Uuid'

  schemas:
    Uuid:
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      pattern: '^[0-9a-fA-F-]{36}$'

    DateTime:
      type: string
      format: date-time

    Email:
      type: string
      format: email
      maxLength: 254
      pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'

    PersonName:
      type: string
      minLength: 1
      maxLength: 100
      pattern: '^[\p{L}\p{N}\p{P}\p{Zs}\-''.]+$'
      example: "Name"

    GeneralString:
      type: string
      minLength: 1
      maxLength: 255
      pattern: '^[0-9a-zA-Z-_À-ÿ-!@#$%^&*():;\/., ]{1,255}$'
      description: String in a general form.
      example: "Message and/or data."

    NonEmptyTitle:
      type: string
      maxLength: 255
      minLength: 1
      pattern: '^[A-Za-z0-9 _&/.(),À-ÿ-]{1,255}$'

    Link:
      type: string
      minLength: 1
      maxLength: 1024
      pattern: '^[0-9a-zA-Z-_À-ÿ-!@#$%&*():;\/.,=?+~\[\]]{1,1024}$'
      example: "https://example.com"

    # Requests

    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 72
          description: Plaintext password (hashed server-side; never stored directly).
          example: "CorrectHorseBatteryStaple"

    CreateContactRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - message
        - name
        - subject
        - userType
      properties:
        email:
          $ref: '#/components/schemas/Email'
        message:
          type: string
          maxLength: 255
          minLength: 10
          example: "Message"
        name:
          $ref: '#/components/schemas/PersonName'
        subject:
          type: string
          maxLength: 100
          description: Subject for the contact.
          example: "Subject"
        userType:
          type: string
          maxLength: 100
          description: Type of user of the contact.
          example: "Employer"

    # Responses

    LoginResponse:
      type: object
      additionalProperties: false
      required:
        - message
        - user
        - jwtToken
        - expiresAt
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 255
          description: Status message for the login operation.
          example: "Login successful"
        user:
          $ref: '#/components/schemas/UserResponse'
        jwtToken:
          type: string
          format: jwt
          minLength: 32
          maxLength: 2048
          pattern: '^[A-Za-z0-9-_]+\.[A-Za-z0-9-_]+\.[A-Za-z0-9-_]+$'
          description: "Signed JWT. Send it as `Authorization: Bearer <jwtToken>`."
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWUsImlhdCI6MTUxNjIzOTAyMn0.KMUFsIDTnFmyG3nMiGM6H9FNFUROf3wh7SmqJp-QV30"
        expiresAt:
          $ref: '#/components/schemas/DateTime'

    UserResponse:
      type: object
      additionalProperties: false
      required:
        - userId
        - name
        - email
        - role
        - createdAt
      properties:
        userId:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: "John Doe"
        email:
          type: string
          format: email
          minLength: 5
          maxLength: 254
          example: "john.doe@company.com"
        mobileNumber:
          type: string
          format: phone
          minLength: 8
          maxLength: 16
          pattern: '^\+[1-9]\d{6,14}$'
          example: "+12025550143"
        role:
          type: string
          enum: [ ROLE_JOB_SEEKER, ROLE_EMPLOYER, ROLE_ADMIN ]
          description: Role of the user, as used by Spring Security and the frontend.
          example: "ROLE_JOB_SEEKER"
        companyId:
          $ref: '#/components/schemas/Uuid'
        companyName:
          type: string
          minLength: 2
          maxLength: 150
          example: "Acme Corp"
        createdAt:
          $ref: '#/components/schemas/DateTime'

    CompanyResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - industry
        - size
        - rating
        - founded
        - createdBy
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          maxLength: 255
          description: Name of the company.
          example: "DerpCorp Inc."
        logo:
          type: string
          maxLength: 500
          description: Relative path to the company logo.
          example: "/logos/derpcorp.png"
        industry:
          type: string
          maxLength: 100
          description: Industry category the company operates in.
          example: "Technology"
        size:
          type: string
          maxLength: 50
          description: Company size descriptor.
          example: "Large"
        rating:
          type: number
          format: double
          minimum: 0.0
          maximum: 5.0
          description: Company review rating.
          example: 4.5
        locations:
          type: string
          maxLength: 1000
          description: Comma-separated list of company locations.
          example: "San Francisco, New York, Austin"
        founded:
          type: integer
          format: int32
          description: Year the company was founded.
          example: 2010
        description:
          type: string
          description: Description of the company.
          example: "DerpCorp Inc. is a leading technology company founded in 2010. We're committed to innovation and creating exceptional experiences for our customers and employees."
        employees:
          type: integer
          format: int32
          description: Total number of employees.
          example: 15000
        website:
          type: string
          maxLength: 500
          description: Official company website URL.
          example: "https://www.derpcorp.example"
        createdAt:
          $ref: '#/components/schemas/DateTime'
        createdBy:
          $ref: '#/components/schemas/Uuid'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        updatedBy:
          $ref: '#/components/schemas/Uuid'
        jobs:
          type: array
          description: Jobs posted by the company.
          items:
            $ref: '#/components/schemas/JobResponse'

    JobResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - companyId
        - title
        - location
        - workType
        - jobType
        - category
        - experienceLevel
        - salaryMin
        - salaryMax
        - salaryCurrency
        - salaryPeriod
        - description
        - postedDate
        - featured
        - urgent
        - remote
        - status
        - createdBy
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        companyId:
          $ref: '#/components/schemas/Uuid'
        title:
          type: string
          maxLength: 255
          description: Job title.
          example: "Senior Frontend Developer"
        location:
          type: string
          maxLength: 255
          description: Job location.
          example: "Nashville, TN"
        workType:
          type: string
          maxLength: 50
          description: Work arrangement (On-site, Remote, Hybrid).
          example: "Hybrid"
        jobType:
          type: string
          maxLength: 50
          description: Employment type (Full-time, Part-time, Contract, Freelance).
          example: "Full-time"
        category:
          type: string
          maxLength: 100
          description: Job category (Technology, Design, Marketing, Sales, Finance, Healthcare, Education, Operations).
          example: "Technology"
        experienceLevel:
          type: string
          maxLength: 50
          description: Experience level (Entry Level, Mid Level, Senior Level, Executive Level).
          example: "Mid Level"
        salaryMin:
          type: number
          description: Minimum salary.
          example: 106000
        salaryMax:
          type: number
          description: Maximum salary.
          example: 173000
        salaryCurrency:
          type: string
          maxLength: 10
          description: Salary currency code.
          example: "USD"
        salaryPeriod:
          type: string
          maxLength: 20
          description: Salary period.
          example: "year"
        description:
          type: string
          description: Full job description.
          example: "We are looking for a skilled Senior Frontend Developer to join our dynamic team."
        requirements:
          type: array
          description: Required skills.
          items:
            type: string
          example: [ "Java", "PostgreSQL" ]
        benefits:
          type: array
          description: Offered benefits.
          items:
            type: string
          example: [ "Health Insurance", "Remote Work" ]
        postedDate:
          $ref: '#/components/schemas/DateTime'
        applicationDeadline:
          $ref: '#/components/schemas/DateTime'
        applicationsCount:
          type: integer
          format: int32
          description: Number of applications received.
          example: 143
        featured:
          type: boolean
          description: Whether the job is featured.
        urgent:
          type: boolean
          description: Whether the job is urgent.
        remote:
          type: boolean
          description: Whether the job can be done remotely.
        status:
          type: string
          maxLength: 20
          description: Job status (ACTIVE, CLOSED, DRAFT).
          example: "ACTIVE"
        createdAt:
          $ref: '#/components/schemas/DateTime'
        createdBy:
          $ref: '#/components/schemas/Uuid'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        updatedBy:
          $ref: '#/components/schemas/Uuid'

    CreateContactResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          maxLength: 100
          description: Status of the processed request.
          example: "Request processed successfully!"

    ProblemDetails:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
        - instance
      properties:
        type:
          type: string
          maxLength: 200
          pattern: '^https?://.+$'
        title:
          type: string
          maxLength: 120
          pattern: '^[A-Za-z0-9 _\-]{1,120}$'
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 1000
          description: Human-readable explanation of this occurrence of the problem.
        instance:
          type: string
          maxLength: 200
          pattern: '^[A-Za-z0-9_.:/-]+$'
          description: Request path that produced the problem.
        errors:
          type: object
          description: Validation messages keyed by field or parameter name. Only present for validation errors.
          additionalProperties:
            type: string
          example:
            email: "must be a well-formed email address"

  responses:
    BadRequest:
      description: Bad Request. Malformed body or invalid fields; validation messages are listed in `errors`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Unauthorized. The endpoint requires a Bearer JWT and none (or an invalid one) was sent.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Forbidden. The caller is authenticated but not allowed to perform this operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Not Found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotAcceptable:
      description: Not Acceptable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnsupportedMediaType:
      description: Unsupported Media Type
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnprocessableEntity:
      description: Unprocessable Entity
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequests:
      description: Too Many Requests
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnexpectedError:
      description: Unexpected Error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
