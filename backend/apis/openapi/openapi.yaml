openapi: 3.0.3
info:
  title: JobLeaf API
  version: 1.0.0
  description: API specification for managing companies, users, jobs.
  contact:
    name: JobLeaf Team

servers:
  - url: http://localhost:8080/jobleaf
    description: Local development server.

security:
  - bearerAuth: [ ]
  - cookieAuth: [ ]

tags:
  - name: Company
    description: Companies management endpoints.
  - name: Contact
    description: Contacts management endpoints.
  - name: User
    description: User management endpoints for the admin.
  - name: Job
    description: Job management endpoints for employers.
  - name: Profile
    description: Job seeker profile with picture and resume.
  - name: SavedJob
    description: Jobs saved by a job seeker.
  - name: JobApplication
    description: Job applications of a job seeker.
  - name: EmployerJobApplication
    description: Applications an employer received for the jobs of their company.
  - name: Authentication
    description: Authentication endpoints.
  - name: CSRF
    description: CSRF token generation endpoint.

paths:
  /companies/public:
    get:
      tags: [ Company ]
      operationId: listCompanies
      summary: List companies.
      description: Returns all companies together with their jobs. Public endpoint, no authentication required.
      security: [ ]
      parameters: [ ]
      responses:
        "200":
          description: Companies retrieved successfully.
          content:
            application/vnd.jobleaf+json;v=1.0:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompanyResponse'
        "406": { $ref: '#/components/responses/NotAcceptable' }
        "429": { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/UnexpectedError' }

  /companies/admin:
    get:
      tags: [ Company ]
      operationId: listCompaniesForAdmin
      summary: List all companies for the admin.
      description: Returns every company with all its details but without jobs, sorted by name. Requires ROLE_ADMIN.
      parameters: [ ]
      responses:
        '200':
          description: Companies retrieved successfully.
          content:
            application/vnd.jobleaf+json;v=1.0:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompanyAdminResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}
    post:
      tags: [ Company ]
      operationId: createCompany
      summary: Create a company.
      description: Creates a company without jobs (employers add jobs later). The name must be unique. Requires ROLE_ADMIN.
      parameters: [ ]
      requestBody:
        required: true
        content:
          application/vnd.jobleaf+json;v=1.0:
            schema:
              $ref: '#/components/schemas/CompanyRequest'
      responses:
        '201':
          description: Company created successfully.
          content:
            application/vnd.jobleaf+json;v=1.0:
              schema:
                $ref: '#/components/schemas/CompanyAdminResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /companies/{id}/admin:
    put:
      tags: [ Company ]
      operationId: updateCompany
      summary: Update a company.
      description: Replaces all details of the company; its jobs are not changed. The name must stay unique. Requires ROLE_ADMIN.
      parameters:
        - $ref: '#/components/parameters/CompanyPathId'
      requestBody:
        required: true
        content:
          application/vnd.jobleaf+json;v=1.0:
            schema:
              $ref: '#/components/schemas/CompanyRequest'
      responses:
        '200':
          description: Company updated successfully.
          content:
            application/vnd.jobleaf+json;v=1.0:
              schema:
                $ref: '#/components/schemas/CompanyAdminResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}
    delete:
      tags: [ Company ]
      operationId: deleteCompany
      summary: Delete a company.
      description: Deletes the company together with its jobs. Employers assigned to it are kept, without a company. Requires ROLE_ADMIN.
      parameters:
        - $ref: '#/components/parameters/CompanyPathId'
      responses:
        '200':
          description: Company deleted successfully.
          content:
            application/vnd.jobleaf+json;v=1.0:
              schema:
                $ref: '#/components/schemas/DeleteCompanyResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /contacts/public:
    post:
      tags: [Contact]
      operationId: createContact
      summary: Create contact.
      description: Creates contact from the contact us page. Public endpoint, no authentication required.
      security: [ ]
      parameters: [ ]
      requestBody:
        required: true
        content:
          application/vnd.jobleaf+json;v=1.0:
            schema:
              $ref: '#/components/schemas/CreateContactRequest'
      responses:
        '201':
          description: Contact created successfully.
          content:
            application/vnd.jobleaf+json;v=1.0:
              schema:
                $ref: '#/components/schemas/CreateContactResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/CsrfTokenMissing'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /contacts/admin:
    get:
      tags: [Contact]
      operationId: fetchNewContactMsgs
      summary: List new contact messages.
      description: Returns all contact messages with status NEW, oldest first. Requires ROLE_ADMIN.
      parameters: [ ]
      responses:
        '200':
          description: New contact messages retrieved successfully.
          content:
            application/vnd.jobleaf+json;v=1.0:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContactResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /contacts/sort/admin:
    get:
      tags: [Contact]
      operationId: fetchNewContactMsgsWithSort
      summary: List new contact messages, sorted.
      description: Returns all contact messages with status NEW in the requested order. Requires ROLE_ADMIN.
      parameters:
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDir'
      responses:
        '200':
          description: New contact messages retrieved successfully.
          content:
            application/vnd.jobleaf+json;v=1.0:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContactResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /contacts/page/admin:
    get:
      tags: [Contact]
      operationId: fetchNewContactMsgsWithPaginationAndSort
      summary: List new contact messages, one page at a time.
      description: Returns one page of the contact messages with status NEW in the requested order. Requires ROLE_ADMIN.
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDir'
      responses:
        '200':
          description: Page of new contact messages retrieved successfully.
          content:
            application/vnd.jobleaf+json;v=1.0:
              schema:
                $ref: '#/components/schemas/ContactPageResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /contacts/{id}/status/admin:
    patch:
      tags: [Contact]
      operationId: closeContactMsg
      summary: Close a contact message.
      description: Sets the status of the contact message to CLOSED. Closing an already closed message changes nothing. Requires ROLE_ADMIN.
      parameters:
        - $ref: '#/components/parameters/ContactId'
      responses:
        '200':
          description: Contact message closed.
          content:
            application/vnd.jobleaf+json;v=1.0:
              schema:
                type: string
                example: "Contact message closed successfully"
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /users/search/admin:
    get:
      tags: [ User ]
      operationId: searchUserByEmail
      summary: Find a user by email.
      description: Returns the user with this email address (case does not matter). Requires ROLE_ADMIN.
      parameters:
        - name: email
          in: query
          required: true
          description: Email address of the user.
          schema:
            $ref: '#/components/schemas/Email'
      responses:
        '200':
          description: User found.
          content:
            application/vnd.jobleaf+json;v=1.0:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /users/{userId}/role/employer/admin:
    patch:
      tags: [ User ]
      operationId: elevateToEmployer
      summary: Make a job seeker an employer.
      description: >-
        Changes the role of a job seeker to ROLE_EMPLOYER. An employer stays unchanged; an admin can not be
        changed (409). The user gets the new role in the token at the next login. Requires ROLE_ADMIN.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The user, now an employer.
          content:
            application/vnd.jobleaf+json;v=1.0:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /users/{userId}/company/{companyId}/admin:
    patch:
      tags: [ User ]
      operationId: assignCompanyToEmployer
      summary: Assign a company to an employer.
      description: >-
        Links the employer to the company (replaces a previous company). Only employers can be assigned (409);
        the user and the company must exist (404). Requires ROLE_ADMIN.
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: companyId
          in: path
          required: true
          description: Unique company identifier.
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The employer with the company assigned.
          content:
            application/vnd.jobleaf+json;v=1.0:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /jobs/employer:
    get:
      tags: [ Job ]
      operationId: listEmployerJobs
      summary: List the jobs of the employer's company.
      description: >-
        Returns all jobs (every status, newest first) of the company the logged-in employer is assigned to.
        403 if the user is not an employer or has no company yet. Requires ROLE_EMPLOYER.
      parameters: [ ]
      responses:
        '200':
          description: Jobs retrieved successfully.
          content:
            application/vnd.jobleaf+json;v=1.0:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}
    post:
      tags: [ Job ]
      operationId: createJob
      summary: Create a job for the employer's company.
      description: >-
        Creates a job in status DRAFT for the company of the logged-in employer (the company is never taken from
        the request). All fields are required. Requires ROLE_EMPLOYER.
      parameters: [ ]
      requestBody:
        required: true
        content:
          application/vnd.jobleaf+json;v=1.0:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '201':
          description: Job created as DRAFT.
          content:
            application/vnd.jobleaf+json;v=1.0:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /jobs/{jobId}/status/employer:
    patch:
      tags: [ Job ]
      operationId: updateJobStatus
      summary: Change the status of a job.
      description: >-
        Publishes (ACTIVE), closes (CLOSED) or reopens a job of the employer's own company. A job can not go back
        to DRAFT once it left it; setting the current status changes nothing. Jobs of other companies answer 404.
        Requires ROLE_EMPLOYER.
      parameters:
        - name: jobId
          in: path
          required: true
          description: Unique job identifier.
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/vnd.jobleaf+json;v=1.0:
            schema:
              $ref: '#/components/schemas/UpdateJobStatusRequest'
      responses:
        '200':
          description: Job status updated.
          content:
            application/vnd.jobleaf+json;v=1.0:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /profile/jobseeker:
    get:
      tags: [ Profile ]
      operationId: getProfile
      summary: Get the job seeker's profile.
      description: >-
        Returns the profile of the logged-in job seeker WITHOUT the file contents (only names and types), so the
        response stays small. The files have their own endpoints. 404 if no profile was saved yet.
        Requires ROLE_JOB_SEEKER.
      parameters: [ ]
      responses:
        '200':
          description: Profile found.
          content:
            application/vnd.jobleaf+json;v=1.0:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}
    put:
      tags: [ Profile ]
      operationId: createOrUpdateProfile
      summary: Create or update the job seeker's profile.
      description: >-
        Multipart request: the 'profile' part (JSON) is required every time; 'profilePicture' (jpg, jpeg or png) and
        'resume' (pdf) are optional, max 10 MB each. A file that is not sent keeps the stored one. The content of
        every file is checked, not only its name. Requires ROLE_JOB_SEEKER.
      parameters: [ ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ profile ]
              properties:
                profile:
                  $ref: '#/components/schemas/ProfileRequest'
                profilePicture:
                  type: string
                  format: binary
                  description: jpg, jpeg or png, max 10 MB.
                resume:
                  type: string
                  format: binary
                  description: pdf, max 10 MB.
            encoding:
              profile:
                contentType: application/json
      responses:
        '200':
          description: Profile saved.
          content:
            application/vnd.jobleaf+json;v=1.0:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /profile/picture/jobseeker:
    get:
      tags: [ Profile ]
      operationId: getProfilePicture
      summary: Get the job seeker's profile picture.
      description: The picture as image bytes, shown inline. 404 if there is none. Requires ROLE_JOB_SEEKER.
      parameters: [ ]
      responses:
        '200':
          description: The picture.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /profile/resume/jobseeker:
    get:
      tags: [ Profile ]
      operationId: getResume
      summary: Download the job seeker's resume.
      description: The resume as a PDF download (Content-Disposition attachment). 404 if there is none. Requires ROLE_JOB_SEEKER.
      parameters: [ ]
      responses:
        '200':
          description: The resume.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /saved-jobs/jobseeker:
    get:
      tags: [ SavedJob ]
      operationId: listSavedJobs
      summary: List the jobs the job seeker saved.
      description: >-
        Returns the saved jobs of the logged-in job seeker, newest posted first. A saved job that was closed later is
        still listed, with its status. Requires ROLE_JOB_SEEKER.
      parameters: [ ]
      responses:
        '200':
          description: Saved jobs retrieved successfully.
          content:
            application/vnd.jobleaf+json;v=1.0:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /saved-jobs/{jobId}/jobseeker:
    post:
      tags: [ SavedJob ]
      operationId: saveJob
      summary: Save a job.
      description: >-
        Saves an ACTIVE job for the logged-in job seeker. Saving it again changes nothing. Jobs that do not exist or
        are not published (drafts) answer 404. Requires ROLE_JOB_SEEKER.
      parameters:
        - name: jobId
          in: path
          required: true
          description: Unique job identifier.
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The saved job.
          content:
            application/vnd.jobleaf+json;v=1.0:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}
    delete:
      tags: [ SavedJob ]
      operationId: unsaveJob
      summary: Remove a job from the saved jobs.
      description: Removes the job from the logged-in job seeker's saved jobs. Removing a job that was not saved changes nothing. Requires ROLE_JOB_SEEKER.
      parameters:
        - name: jobId
          in: path
          required: true
          description: Unique job identifier.
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The job is no longer saved.
          content:
            application/vnd.jobleaf+json;v=1.0:
              schema:
                $ref: '#/components/schemas/UnsaveJobResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /job-applications/jobseeker:
    get:
      tags: [ JobApplication ]
      operationId: listMyApplications
      summary: List the job seeker's applications.
      description: >-
        All applications of the logged-in job seeker with their job, newest first. Withdrawn applications are included
        with status WITHDRAWN. The employer's internal notes are never returned. Requires ROLE_JOB_SEEKER.
      parameters: [ ]
      responses:
        '200':
          description: Applications retrieved successfully.
          content:
            application/vnd.jobleaf+json;v=1.0:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobApplicationResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}
    post:
      tags: [ JobApplication ]
      operationId: applyForJob
      summary: Apply for a job.
      description: >-
        Applies the logged-in job seeker to an ACTIVE job whose deadline has not passed. Requires a profile with a
        resume (409 with errors.profile otherwise). Applying twice answers 409; after a withdrawal the same application
        is reopened. Requires ROLE_JOB_SEEKER.
      parameters: [ ]
      requestBody:
        required: true
        content:
          application/vnd.jobleaf+json;v=1.0:
            schema:
              $ref: '#/components/schemas/ApplyJobRequest'
      responses:
        '201':
          description: Application submitted.
          content:
            application/vnd.jobleaf+json;v=1.0:
              schema:
                $ref: '#/components/schemas/JobApplicationResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /job-applications/{jobId}/jobseeker:
    delete:
      tags: [ JobApplication ]
      operationId: withdrawApplication
      summary: Withdraw the application for a job.
      description: >-
        Sets the logged-in job seeker's application for this job to WITHDRAWN (the history is kept). Withdrawing again
        changes nothing; a rejected application can not be withdrawn (409). Requires ROLE_JOB_SEEKER.
      parameters:
        - name: jobId
          in: path
          required: true
          description: Unique job identifier.
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The withdrawn application.
          content:
            application/vnd.jobleaf+json;v=1.0:
              schema:
                $ref: '#/components/schemas/JobApplicationResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /jobs/{jobId}/applications/employer:
    get:
      tags: [ EmployerJobApplication ]
      operationId: getApplicationsByJobForEmployer
      summary: List the applications received for a job.
      description: >-
        All applications for a job of the employer's own company, newest first, with the applicant's contact details
        and profile (without the files). Withdrawn applications are left out. Jobs of other companies answer 404.
        Requires ROLE_EMPLOYER.
      parameters:
        - name: jobId
          in: path
          required: true
          description: Unique job identifier.
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Applications retrieved successfully.
          content:
            application/vnd.jobleaf+json;v=1.0:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReceivedApplicationResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /jobs/applications/{applicationId}/employer:
    patch:
      tags: [ EmployerJobApplication ]
      operationId: updateJobApplication
      summary: Change the status and notes of a received application.
      description: >-
        Moves an application for a job of the employer's own company to REVIEWED, SHORTLISTED, INTERVIEWED, OFFERED
        or REJECTED (PENDING and WITHDRAWN are set by the job seeker: 400). The notes are internal and never shown to
        the job seeker; leaving notes out keeps the stored ones, an empty text removes them. A withdrawn application
        can not be changed (409). Applications for other companies' jobs answer 404. Requires ROLE_EMPLOYER.
      parameters:
        - name: applicationId
          in: path
          required: true
          description: Unique job application identifier.
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/vnd.jobleaf+json;v=1.0:
            schema:
              $ref: '#/components/schemas/UpdateJobApplicationRequest'
      responses:
        '200':
          description: Application updated.
          content:
            application/vnd.jobleaf+json;v=1.0:
              schema:
                $ref: '#/components/schemas/ReceivedApplicationResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /jobs/applications/{applicationId}/picture/employer:
    get:
      tags: [ EmployerJobApplication ]
      operationId: getApplicantProfilePicture
      summary: Get the profile picture of an applicant.
      description: >-
        The picture of the job seeker behind an application for a job of the employer's own company, as image bytes
        shown inline. 404 if there is none, if the application was withdrawn, or if it is for another company's job.
        Requires ROLE_EMPLOYER.
      parameters:
        - name: applicationId
          in: path
          required: true
          description: Unique job application identifier.
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The picture.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /jobs/applications/{applicationId}/resume/employer:
    get:
      tags: [ EmployerJobApplication ]
      operationId: getApplicantResume
      summary: Download the resume of an applicant.
      description: >-
        The resume of the job seeker behind an application for a job of the employer's own company, as a PDF
        download. 404 if there is none, if the application was withdrawn, or if it is for another company's job.
        Requires ROLE_EMPLOYER.
      parameters:
        - name: applicationId
          in: path
          required: true
          description: Unique job application identifier.
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The resume.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /auth/login/public:
    post:
      tags: [Authentication]
      operationId: loginUser
      summary: Login user.
      description: |
        Checks the email and password and sets the signed JWT in the `JOBLEAF_ACCESS_TOKEN` cookie
        (HttpOnly, Secure, SameSite=Lax), valid until `expiresAt`. The token is not in the response body,
        so JavaScript never sees it.
      security: [ ]
      parameters: [ ]
      requestBody:
        required: true
        content:
          application/vnd.jobleaf+json;v=1.0:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful.
          content:
            application/vnd.jobleaf+json;v=1.0:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/CsrfTokenMissing'}
        '401':
          description: Invalid email or password. The same message is used for both, so callers cannot tell which emails are registered.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /auth/register/public:
    post:
      tags: [ Authentication ]
      operationId: registerUser
      summary: Register user.
      description: |
        Creates an account and logs the user in: returns the user and sets the JWT cookie, like the login.
        Every new account gets the role `ROLE_JOB_SEEKER`; only an admin can change it.
        Passwords found in known data breaches are rejected.
        Like every POST, it needs the CSRF token: see `GET /csrf-token/public`.
      security: [ ]
      parameters: [ ]
      requestBody:
        required: true
        content:
          application/vnd.jobleaf+json;v=1.0:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Register successful.
          content:
            application/vnd.jobleaf+json;v=1.0:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/CsrfTokenMissing' }
        '409':
          description: An account with this email or mobile number already exists; the field is listed in `errors`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/UnexpectedError' }

  /auth/logout/public:
    post:
      tags: [ Authentication ]
      operationId: logoutUser
      summary: Logout user.
      description: |
        Deletes the `JOBLEAF_ACCESS_TOKEN` cookie. The browser cannot do it itself because the cookie is HttpOnly.
        Public, so it also works with an expired token. Like every POST, it needs the CSRF token.
      security: [ ]
      parameters: [ ]
      responses:
        '200':
          description: Logged out; the response also tells the browser to delete the cookie.
          content:
            application/vnd.jobleaf+json;v=1.0:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '403': { $ref: '#/components/responses/CsrfTokenMissing' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/UnexpectedError' }

  /csrf-token/public:
    get:
      tags: [ CSRF ]
      operationId: getCSRFToken
      summary: Get CSRF token.
      description: |
        Returns the CSRF token and sets it in the `XSRF-TOKEN` cookie.
        Every POST, PUT, PATCH and DELETE must send the same value in the `X-XSRF-TOKEN` header,
        otherwise it is rejected with 403. Call this once before the first such request.
      security: [ ]
      parameters: [ ]
      responses:
        "200":
          description: CSRF token retrieved successfully.
          content:
            application/vnd.jobleaf+json;v=1.0:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
        "406": { $ref: '#/components/responses/NotAcceptable' }
        "429": { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/UnexpectedError' }


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: For API clients. Browsers use the cookie instead.
    cookieAuth:
      type: apiKey
      in: cookie
      name: JOBLEAF_ACCESS_TOKEN
      description: |
        HttpOnly cookie set by login and register. The browser sends it automatically,
        so state-changing requests also need the CSRF token.

  parameters:
    CompanyId:
      name: companyId
      in: path
      required: true
      description: Unique company identifier.
      schema:
        $ref: '#/components/schemas/Uuid'

    CompanyPathId:
      name: id
      in: path
      required: true
      description: Unique company identifier.
      schema:
        $ref: '#/components/schemas/Uuid'
    UserId:
      name: userId
      in: path
      required: true
      description: Unique user identifier.
      schema:
        $ref: '#/components/schemas/Uuid'
    ContactId:
      name: id
      in: path
      required: true
      description: Unique contact identifier.
      schema:
        $ref: '#/components/schemas/Uuid'
    SortBy:
      name: sortBy
      in: query
      required: false
      description: Field to sort by.
      schema:
        type: string
        enum: [createdAt, name, email, subject, userType, status]
        default: createdAt
    SortDir:
      name: sortDir
      in: query
      required: false
      description: Sort direction.
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    PageNumber:
      name: pageNumber
      in: query
      required: false
      description: Zero-based page index.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Number of items per page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 10

  schemas:
    Uuid:
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      pattern: '^[0-9a-fA-F-]{36}$'

    DateTime:
      type: string
      format: date-time

    Email:
      type: string
      format: email
      maxLength: 254
      pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'

    PersonName:
      type: string
      minLength: 1
      maxLength: 100
      pattern: '^[\p{L}\p{N}\p{P}\p{Zs}\-''.]+$'
      example: "Name"

    GeneralString:
      type: string
      minLength: 1
      maxLength: 255
      pattern: '^[0-9a-zA-Z-_À-ÿ-!@#$%^&*():;\/., ]{1,255}$'
      description: String in a general form.
      example: "Message and/or data."

    NonEmptyTitle:
      type: string
      maxLength: 255
      minLength: 1
      pattern: '^[A-Za-z0-9 _&/.(),À-ÿ-]{1,255}$'

    Link:
      type: string
      minLength: 1
      maxLength: 1024
      pattern: '^[0-9a-zA-Z-_À-ÿ-!@#$%&*():;\/.,=?+~\[\]]{1,1024}$'
      example: "https://example.com"

    # Requests

    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 72
          description: Plaintext password (hashed server-side; never stored directly).
          example: "CorrectHorseBatteryStaple"

    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - email
        - mobileNumber
        - password
      properties:
        name:
          $ref: '#/components/schemas/PersonName'
        email:
          $ref: '#/components/schemas/Email'
        mobileNumber:
          type: string
          format: phone
          minLength: 8
          maxLength: 16
          pattern: '^\+[1-9]\d{6,14}$'
          example: "+12025550143"
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 72
          description: Plaintext password (hashed server-side; never stored directly).
          example: "CorrectHorseBatteryStaple"

    CreateContactRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - message
        - name
        - subject
        - userType
      properties:
        email:
          $ref: '#/components/schemas/Email'
        message:
          type: string
          maxLength: 255
          minLength: 10
          example: "Message"
        name:
          $ref: '#/components/schemas/PersonName'
        subject:
          type: string
          maxLength: 100
          description: Subject for the contact.
          example: "Subject"
        userType:
          type: string
          maxLength: 100
          description: Type of user of the contact.
          example: "Employer"

    # Responses

    CsrfTokenResponse:
      type: object
      additionalProperties: false
      required:
        - token
        - headerName
      properties:
        token:
          type: string
          description: CSRF token. The same value is also set in the `XSRF-TOKEN` cookie.
          example: "4bfd1575-3ad1-4d21-96c7-4ef2d9f86721"
        headerName:
          type: string
          description: Header in which the token must be sent back.
          example: "X-XSRF-TOKEN"

    LogoutResponse:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          maxLength: 255
          description: Status message for the logout.
          example: "Logout successful"

    RegisterResponse:
      type: object
      additionalProperties: false
      required:
        - message
        - user
        - expiresAt
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 255
          description: Status message for the registration.
          example: "Registration successful"
        user:
          $ref: '#/components/schemas/UserResponse'
        expiresAt:
          $ref: '#/components/schemas/DateTime'
          description: When the token in the cookie stops being accepted; log in again after that.

    LoginResponse:
      type: object
      additionalProperties: false
      required:
        - message
        - user
        - expiresAt
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 255
          description: Status message for the login operation.
          example: "Login successful"
        user:
          $ref: '#/components/schemas/UserResponse'
        expiresAt:
          $ref: '#/components/schemas/DateTime'

    UserResponse:
      type: object
      additionalProperties: false
      required:
        - userId
        - name
        - email
        - role
        - createdAt
      properties:
        userId:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: "John Doe"
        email:
          type: string
          format: email
          minLength: 5
          maxLength: 254
          example: "john.doe@company.com"
        mobileNumber:
          type: string
          format: phone
          minLength: 8
          maxLength: 16
          pattern: '^\+[1-9]\d{6,14}$'
          example: "+12025550143"
        role:
          type: string
          enum: [ ROLE_JOB_SEEKER, ROLE_EMPLOYER, ROLE_ADMIN ]
          description: Role of the user, as used by Spring Security and the frontend.
          example: "ROLE_JOB_SEEKER"
        companyId:
          $ref: '#/components/schemas/Uuid'
        companyName:
          type: string
          minLength: 2
          maxLength: 150
          example: "Acme Corp"
        createdAt:
          $ref: '#/components/schemas/DateTime'

    CompanyRequest:
      type: object
      additionalProperties: false
      description: All details of a company, used to create and to update one.
      required: [founded]
      properties:
        name:
          type: string
          maxLength: 255
          description: Unique name of the company.
          example: "DerpCorp Inc."
          x-field-extra-annotation: '@NotBlank(message = "Name can not be empty")'
        logo:
          type: string
          maxLength: 500
          description: Path or URL of the company logo.
          example: "/logos/derpcorp.png"
          x-field-extra-annotation: '@NotBlank(message = "Logo can not be empty")'
        industry:
          type: string
          maxLength: 100
          description: Industry category the company operates in.
          example: "Technology"
          x-field-extra-annotation: '@NotBlank(message = "Industry can not be empty")'
        size:
          type: string
          maxLength: 50
          description: Company size descriptor.
          example: "Large"
          x-field-extra-annotation: '@NotBlank(message = "Size can not be empty")'
        rating:
          type: number
          description: Company rating from 0 to 5. Optional, a new company without reviews gets 0.
          example: 4.5
          x-field-extra-annotation: '@DecimalMin(value = "0.0", message = "Rating must be at least 0") @DecimalMax(value = "5.0", message = "Rating must be at most 5")'
        locations:
          type: string
          maxLength: 1000
          description: Comma-separated list of company locations.
          example: "Bucharest, Cluj-Napoca"
          x-field-extra-annotation: '@NotBlank(message = "Locations can not be empty")'
        founded:
          type: integer
          format: int32
          description: Year the company was founded, 1900 or later.
          example: 2010
          x-field-extra-annotation: '@Min(value = 1900, message = "Founded must be 1900 or later")'
        description:
          type: string
          maxLength: 5000
          description: Description of the company.
          example: "DerpCorp Inc. is a leading technology company."
          x-field-extra-annotation: '@NotBlank(message = "Description can not be empty")'
        employees:
          type: integer
          format: int32
          description: Total number of employees, at least 1.
          example: 15000
          x-field-extra-annotation: '@Min(value = 1, message = "Employees must be greater than or equal to 1")'
        website:
          type: string
          maxLength: 500
          description: Official company website URL.
          example: "https://www.derpcorp.example"
          x-field-extra-annotation: '@NotBlank(message = "Website can not be empty")'

    CompanyAdminResponse:
      type: object
      additionalProperties: false
      description: All details of a company, without its jobs.
      required: [id, name, industry, size, rating, founded, createdBy]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          example: "DerpCorp Inc."
        logo:
          type: string
          example: "/logos/derpcorp.png"
        industry:
          type: string
          example: "Technology"
        size:
          type: string
          example: "Large"
        rating:
          type: number
          format: double
          example: 4.5
        locations:
          type: string
          example: "Bucharest, Cluj-Napoca"
        founded:
          type: integer
          format: int32
          example: 2010
        description:
          type: string
        employees:
          type: integer
          format: int32
          example: 15000
        website:
          type: string
          example: "https://www.derpcorp.example"
        createdAt:
          $ref: '#/components/schemas/DateTime'
        createdBy:
          $ref: '#/components/schemas/Uuid'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        updatedBy:
          $ref: '#/components/schemas/Uuid'

    DeleteCompanyResponse:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          example: "Company deleted successfully"

    CompanyResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - industry
        - size
        - rating
        - founded
        - createdBy
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          maxLength: 255
          description: Name of the company.
          example: "DerpCorp Inc."
        logo:
          type: string
          maxLength: 500
          description: Relative path to the company logo.
          example: "/logos/derpcorp.png"
        industry:
          type: string
          maxLength: 100
          description: Industry category the company operates in.
          example: "Technology"
        size:
          type: string
          maxLength: 50
          description: Company size descriptor.
          example: "Large"
        rating:
          type: number
          format: double
          minimum: 0.0
          maximum: 5.0
          description: Company review rating.
          example: 4.5
        locations:
          type: string
          maxLength: 1000
          description: Comma-separated list of company locations.
          example: "San Francisco, New York, Austin"
        founded:
          type: integer
          format: int32
          description: Year the company was founded.
          example: 2010
        description:
          type: string
          description: Description of the company.
          example: "DerpCorp Inc. is a leading technology company founded in 2010. We're committed to innovation and creating exceptional experiences for our customers and employees."
        employees:
          type: integer
          format: int32
          description: Total number of employees.
          example: 15000
        website:
          type: string
          maxLength: 500
          description: Official company website URL.
          example: "https://www.derpcorp.example"
        createdAt:
          $ref: '#/components/schemas/DateTime'
        createdBy:
          $ref: '#/components/schemas/Uuid'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        updatedBy:
          $ref: '#/components/schemas/Uuid'
        jobs:
          type: array
          description: Jobs posted by the company.
          items:
            $ref: '#/components/schemas/JobResponse'

    JobResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - companyId
        - title
        - location
        - workType
        - jobType
        - category
        - experienceLevel
        - salaryMin
        - salaryMax
        - salaryCurrency
        - salaryPeriod
        - description
        - postedDate
        - featured
        - urgent
        - remote
        - status
        - createdBy
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        companyId:
          $ref: '#/components/schemas/Uuid'
        title:
          type: string
          maxLength: 255
          description: Job title.
          example: "Senior Frontend Developer"
        location:
          type: string
          maxLength: 255
          description: Job location.
          example: "Nashville, TN"
        workType:
          type: string
          maxLength: 50
          description: Work arrangement (On-site, Remote, Hybrid).
          example: "Hybrid"
        jobType:
          type: string
          maxLength: 50
          description: Employment type (Full-time, Part-time, Contract, Freelance).
          example: "Full-time"
        category:
          type: string
          maxLength: 100
          description: Job category (Technology, Design, Marketing, Sales, Finance, Healthcare, Education, Operations).
          example: "Technology"
        experienceLevel:
          type: string
          maxLength: 50
          description: Experience level (Entry Level, Mid Level, Senior Level, Executive Level).
          example: "Mid Level"
        salaryMin:
          type: number
          description: Minimum salary.
          example: 106000
        salaryMax:
          type: number
          description: Maximum salary.
          example: 173000
        salaryCurrency:
          type: string
          maxLength: 10
          description: Salary currency code.
          example: "USD"
        salaryPeriod:
          type: string
          maxLength: 20
          description: Salary period.
          example: "year"
        description:
          type: string
          description: Full job description.
          example: "We are looking for a skilled Senior Frontend Developer to join our dynamic team."
        requirements:
          type: array
          description: Required skills.
          items:
            type: string
          example: [ "Java", "PostgreSQL" ]
        benefits:
          type: array
          description: Offered benefits.
          items:
            type: string
          example: [ "Health Insurance", "Remote Work" ]
        postedDate:
          $ref: '#/components/schemas/DateTime'
        applicationDeadline:
          $ref: '#/components/schemas/DateTime'
        applicationsCount:
          type: integer
          format: int32
          description: Number of applications received.
          example: 143
        featured:
          type: boolean
          description: Whether the job is featured.
        urgent:
          type: boolean
          description: Whether the job is urgent.
        remote:
          type: boolean
          description: Whether the job can be done remotely.
        status:
          type: string
          maxLength: 20
          description: Job status (ACTIVE, CLOSED, DRAFT).
          example: "ACTIVE"
        createdAt:
          $ref: '#/components/schemas/DateTime'
        createdBy:
          $ref: '#/components/schemas/Uuid'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        updatedBy:
          $ref: '#/components/schemas/Uuid'

    JobStatus:
      type: string
      enum: [ DRAFT, ACTIVE, CLOSED ]
      description: DRAFT when created, ACTIVE when published (visible to job seekers), CLOSED when no longer open.

    UpdateJobStatusRequest:
      type: object
      additionalProperties: false
      required: [ status ]
      properties:
        status:
          $ref: '#/components/schemas/JobStatus'

    CreateJobRequest:
      type: object
      additionalProperties: false
      description: A new job. The company is the employer's own and the status is always DRAFT.
      required: [ title, location, workType, jobType, category, experienceLevel, salaryMin, salaryMax,
                  salaryCurrency, salaryPeriod, description, requirements, benefits, applicationDeadline,
                  featured, urgent, remote ]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 255
          example: "Senior Frontend Developer"
        location:
          type: string
          minLength: 2
          maxLength: 255
          example: "Bucharest"
        workType:
          type: string
          enum: [ On-site, Remote, Hybrid ]
        jobType:
          type: string
          enum: [ Full-time, Part-time, Contract, Freelance ]
        category:
          type: string
          enum: [ Technology, Design, Marketing, Sales, Finance, Healthcare, Education, Operations ]
        experienceLevel:
          type: string
          enum: [ Entry Level, Mid Level, Senior Level, Executive Level ]
        salaryMin:
          type: number
          minimum: 0
          example: 50000
        salaryMax:
          type: number
          minimum: 0
          description: Must be greater than or equal to salaryMin.
          example: 80000
        salaryCurrency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO currency code.
          example: "EUR"
        salaryPeriod:
          type: string
          enum: [ hour, month, year ]
        description:
          type: string
          minLength: 20
          maxLength: 10000
          example: "We are looking for a skilled frontend developer to join our team."
        requirements:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: string
            minLength: 1
            maxLength: 200
          example: [ "React", "TypeScript" ]
        benefits:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: string
            minLength: 1
            maxLength: 200
          example: [ "Health Insurance", "Remote Work" ]
        applicationDeadline:
          $ref: '#/components/schemas/DateTime'
        featured:
          type: boolean
        urgent:
          type: boolean
        remote:
          type: boolean

    ProfileRequest:
      type: object
      additionalProperties: false
      description: The text part of a profile; the files are separate parts of the same request.
      required: [ jobTitle, location, experienceLevel, professionalBio ]
      properties:
        jobTitle:
          type: string
          minLength: 2
          maxLength: 255
          example: "Frontend Developer"
        location:
          type: string
          minLength: 2
          maxLength: 255
          example: "Bucharest"
        experienceLevel:
          type: string
          enum: [ Entry Level, Mid Level, Senior Level, Executive Level ]
        professionalBio:
          type: string
          minLength: 20
          maxLength: 5000
          example: "Frontend developer with 4 years of React experience."
        portfolioWebsite:
          type: string
          maxLength: 500
          pattern: '^https?://.+'
          example: "https://my-portfolio.example"

    ProfileResponse:
      type: object
      additionalProperties: false
      description: A profile without file contents; the names and types say which files exist.
      required: [ id, jobTitle, location, experienceLevel, professionalBio, hasProfilePicture, hasResume ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        jobTitle:
          type: string
        location:
          type: string
        experienceLevel:
          type: string
        professionalBio:
          type: string
        portfolioWebsite:
          type: string
        hasProfilePicture:
          type: boolean
        profilePictureName:
          type: string
        profilePictureType:
          type: string
        hasResume:
          type: boolean
        resumeName:
          type: string
        resumeType:
          type: string
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'

    UnsaveJobResponse:
      type: object
      additionalProperties: false
      required: [ message ]
      properties:
        message:
          type: string
          example: "Job removed from saved jobs"

    ApplicationStatus:
      type: string
      enum: [ PENDING, REVIEWED, SHORTLISTED, INTERVIEWED, OFFERED, REJECTED, WITHDRAWN ]

    ApplyJobRequest:
      type: object
      additionalProperties: false
      required: [ jobId ]
      properties:
        jobId:
          $ref: '#/components/schemas/Uuid'
        coverLetter:
          type: string
          maxLength: 5000
          description: Optional cover letter.

    JobApplicationResponse:
      type: object
      additionalProperties: false
      required: [ id, job, appliedAt, status ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        job:
          $ref: '#/components/schemas/JobResponse'
        appliedAt:
          $ref: '#/components/schemas/DateTime'
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        coverLetter:
          type: string
        updatedAt:
          $ref: '#/components/schemas/DateTime'

    UpdateJobApplicationRequest:
      type: object
      additionalProperties: false
      required: [ status ]
      properties:
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        notes:
          type: string
          maxLength: 5000
          description: Internal notes of the employer. Left out keeps the stored notes; an empty text removes them.

    ApplicantResponse:
      type: object
      additionalProperties: false
      description: The job seeker behind an application, with the profile details (the files have their own endpoints).
      required: [ userId, name, email, hasResume, hasProfilePicture ]
      properties:
        userId:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        email:
          type: string
        mobileNumber:
          type: string
        jobTitle:
          type: string
        location:
          type: string
        experienceLevel:
          type: string
        professionalBio:
          type: string
        portfolioWebsite:
          type: string
        hasResume:
          type: boolean
        hasProfilePicture:
          type: boolean

    ReceivedApplicationResponse:
      type: object
      additionalProperties: false
      description: An application as the employer sees it, including the internal notes.
      required: [ id, jobId, applicant, appliedAt, status ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        jobId:
          $ref: '#/components/schemas/Uuid'
        applicant:
          $ref: '#/components/schemas/ApplicantResponse'
        appliedAt:
          $ref: '#/components/schemas/DateTime'
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        coverLetter:
          type: string
        notes:
          type: string
        updatedAt:
          $ref: '#/components/schemas/DateTime'

    ContactStatus:
      type: string
      enum: [NEW, CLOSED]
      description: NEW until an admin closes the message.

    ContactResponse:
      type: object
      additionalProperties: false
      required: [id, name, email, userType, subject, message, status, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          example: "Jane Doe"
        email:
          type: string
          example: "jane@example.com"
        userType:
          type: string
          example: "Employer"
        subject:
          type: string
          example: "Subject"
        message:
          type: string
          example: "Message"
        status:
          $ref: '#/components/schemas/ContactStatus'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'

    ContactPageResponse:
      type: object
      additionalProperties: false
      description: One page of contact messages, plus the numbers needed to show a pager.
      required: [content, pageNumber, pageSize, totalElements, totalPages, first, last]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ContactResponse'
        pageNumber:
          type: integer
          format: int32
          description: Zero-based index of this page.
        pageSize:
          type: integer
          format: int32
          description: Requested number of items per page.
        totalElements:
          type: integer
          format: int64
          description: Number of matching items over all pages.
        totalPages:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean

    CreateContactResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          maxLength: 100
          description: Status of the processed request.
          example: "Request processed successfully!"

    ProblemDetails:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
        - instance
      properties:
        type:
          type: string
          maxLength: 200
          pattern: '^https?://.+$'
        title:
          type: string
          maxLength: 120
          pattern: '^[A-Za-z0-9 _\-]{1,120}$'
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 1000
          description: Explanation of this occurrence of the problem.
        instance:
          type: string
          maxLength: 200
          pattern: '^[A-Za-z0-9_.:/-]+$'
          description: Request path that produced the problem.
        errors:
          type: object
          description: Validation messages keyed by field or parameter name. Only present for validation errors.
          additionalProperties:
            type: string
          example:
            email: "must be a well-formed email address"

  responses:
    BadRequest:
      description: Bad Request. Malformed body or invalid fields; validation messages are listed in `errors`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Unauthorized. The endpoint requires a Bearer JWT and none (or an invalid one) was sent.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    CsrfTokenMissing:
      description: Forbidden. The CSRF token is missing or does not match the `XSRF-TOKEN` cookie; get one from `GET /csrf-token/public`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Forbidden. The caller is authenticated but not allowed to perform this operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Not Found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotAcceptable:
      description: Not Acceptable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnsupportedMediaType:
      description: Unsupported Media Type
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PayloadTooLarge:
      description: Payload Too Large. A file is bigger than 10 MB (or the whole request bigger than 21 MB).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnprocessableEntity:
      description: Unprocessable Entity
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequests:
      description: Too Many Requests
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnexpectedError:
      description: Unexpected Error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
