spring.application.name=infrastructure-test
spring.liquibase.enabled=false

# Test-only signing key (not used outside tests)
jobleaf.jwt.header=Authorization
jobleaf.jwt.secret=test-secret-key-for-unit-tests-only-0123456789
jobleaf.jwt.expiration=PT1H
jobleaf.jwt.cookie.name=JOBLEAF_ACCESS_TOKEN
jobleaf.jwt.cookie.secure=true
spring.jackson.deserialization.fail-on-unknown-properties=true
