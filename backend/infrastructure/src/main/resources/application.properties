spring.profiles.default=local
spring.application.name=jobleaf

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:5432}/${SPRING_DATASOURCE_NAME:jobleaf}?currentSchema=${SPRING_DATASOURCE_SCHEMA:jobleaf}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:jobleaf}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:jobleaf}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=${SPRING_DATASOURCE_SCHEMA:jobleaf}
spring.jpa.properties.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.hibernate.envers.default_schema=${SPRING_DATASOURCE_SCHEMA:jobleaf}
spring.jpa.properties.hibernate.envers.store_data_at_delete=true

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:/scripts/init.sql

spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=${SPRING_DATASOURCE_SCHEMA:jobleaf}
spring.liquibase.liquibase-schema=${SPRING_DATASOURCE_SCHEMA:jobleaf}

spring.jackson.deserialization.fail-on-unknown-properties=true

jobleaf.security.require-bearer = true

# Actuator & Metrics for Prometheus (scraped by Prometheus at /actuator/prometheus)
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# Disable Micrometer OTLP metrics push (prevents 404 connection attempts to localhost:4318)
management.otlp.metrics.export.enabled=false

# OpenTelemetry resource attributes (Spring Boot 4.x)
management.opentelemetry.resource-attributes.service.name=${spring.application.name}

# Distributed Tracing -> Grafana Tempo via OTLP/HTTP
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

# Logs export -> Grafana Loki via OTLP/HTTP (Loki 3.x supports /otlp/v1/logs)
management.opentelemetry.logging.export.otlp.enabled=true
management.opentelemetry.logging.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://localhost:3100/otlp/v1/logs}

# Logging pattern with traceId and spanId for Grafana Loki correlation
logging.pattern.level=%5p [${spring.application.name:jobleaf},%X{traceId:-},%X{spanId:-},user=%X{userId:-}]
