databaseChangeLog:
  - changeSet:
      id: 2026-10-27-16-40-create-revinfo-table
      author: Seby
      comment: "Creates the revinfo table and sequence for Hibernate Envers revision tracking."
      changes:
        - createSequence:
            sequenceName: revinfo_seq
            startValue: 1
            incrementBy: 1
        - createTable:
            tableName: revinfo
            columns:
              - column:
                  name: rev
                  type: BIGINT
                  constraints:
                    primaryKey: true
              - column:
                  name: revtstmp
                  type: BIGINT
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: revinfo
        - dropSequence:
            sequenceName: revinfo_seq

  - changeSet:
      id: 2026-10-27-16-41-create-contacts-aud-table
      author: Seby
      comment: "Creates the contacts_aud audit table for Hibernate Envers."
      changes:
        - createTable:
            tableName: contacts_aud
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: rev
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: revtype
                  type: SMALLINT
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
              - column:
                  name: email
                  type: VARCHAR(254)
              - column:
                  name: user_type
                  type: VARCHAR(100)
              - column:
                  name: subject
                  type: VARCHAR(100)
              - column:
                  name: message
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: created_by
                  type: UUID
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: updated_by
                  type: UUID
        - addPrimaryKey:
            tableName: contacts_aud
            columnNames: id, rev
            constraintName: pk_contacts_aud
        - addForeignKeyConstraint:
            baseTableName: contacts_aud
            baseColumnNames: rev
            referencedTableName: revinfo
            referencedColumnNames: rev
            constraintName: fk_contacts_aud_revinfo
      rollback:
        - dropTable:
            tableName: contacts_aud

  - changeSet:
      id: 2026-10-27-16-42-create-companies-aud-table
      author: Seby
      comment: "Creates the companies_aud audit table for Hibernate Envers."
      changes:
        - createTable:
