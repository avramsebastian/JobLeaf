databaseChangeLog:
  - changeSet:
      id: 2026-11-24-12-00-create-job-applications-table
      author: Seby
      comment: >-
        Applications of job seekers to jobs. One application per user and job (unique key); withdrawing keeps the row
        with status WITHDRAWN, and applying again reuses it. Deleting a user or a job deletes its applications.
        Status: PENDING, REVIEWED, SHORTLISTED, INTERVIEWED, OFFERED, REJECTED, WITHDRAWN.
      changes:
        - createTable:
            tableName: job_applications
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_job_applications_user
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: job_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_job_applications_job
                    references: jobs(id)
                    deleteCascade: true
              - column:
                  name: applied_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: cover_letter
                  type: TEXT
              - column:
                  name: notes
                  type: TEXT
                  remarks: "Internal notes of the employer, never shown to the job seeker"
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: updated_by
                  type: UUID
        - addUniqueConstraint:
            tableName: job_applications
            columnNames: user_id, job_id
            constraintName: uk_job_applications_user_job
        - createIndex:
            tableName: job_applications
            indexName: idx_job_applications_job_id
            columns:
              - column:
                  name: job_id
        - createTable:
            tableName: job_applications_aud
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: rev
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: revtype
                  type: SMALLINT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
              - column:
                  name: job_id
                  type: UUID
              - column:
                  name: applied_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: status
                  type: VARCHAR(50)
              - column:
                  name: cover_letter
                  type: TEXT
              - column:
                  name: notes
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: created_by
                  type: UUID
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: updated_by
                  type: UUID
        - addPrimaryKey:
            tableName: job_applications_aud
            columnNames: id, rev
            constraintName: pk_job_applications_aud
        - addForeignKeyConstraint:
            baseTableName: job_applications_aud
            baseColumnNames: rev
            referencedTableName: revinfo
            referencedColumnNames: rev
            constraintName: fk_job_applications_aud_revinfo
      rollback:
        - dropTable:
            tableName: job_applications_aud
        - dropTable:
            tableName: job_applications
