name: jobleaf
services:
  postgres:
    image: postgres:16-alpine
    container_name: jobleaf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:        ${POSTGRES_DB}
      POSTGRES_USER:      ${POSTGRES_USER}
      POSTGRES_PASSWORD:  ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../infrastructure/src/main/resources/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube-db:
    image: postgres:16-alpine
    container_name: jobleaf-sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:        ${SONARQUBE_DB}
      POSTGRES_USER:      ${SONARQUBE_USER}
      POSTGRES_PASSWORD:  ${SONARQUBE_PASSWORD}
    volumes:
      - sonarqube_db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${SONARQUBE_USER} -d ${SONARQUBE_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:lts-community
    container_name: jobleaf-sonarqube
    restart: unless-stopped
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${SONARQUBE_DB}
      SONAR_JDBC_USERNAME: ${SONARQUBE_USER}
      SONAR_JDBC_PASSWORD: ${SONARQUBE_PASSWORD}
    ports:
      - "${SONARQUBE_PORT}:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
    depends_on:
      sonarqube-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  postgres_data:
  sonarqube_db:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions: